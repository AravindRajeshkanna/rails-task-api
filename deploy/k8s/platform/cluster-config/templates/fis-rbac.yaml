{{- if .Values.fis.enabled }}
# AWS Fault Injection Service needs to list and delete pods in the target namespace, and run its helper
# from a ServiceAccount. Enabled only where chaos experiments are allowed (terraform: enable_fis).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fis-experiment
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fis-experiment
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [ "" ]
    resources: [ pods ]
    verbs: [ get, list, watch, delete, create ]
  - apiGroups: [ "" ]
    resources: [ pods/ephemeralcontainers ]
    verbs: [ update ]
  - apiGroups: [ "" ]
    resources: [ pods/exec ]
    verbs: [ create ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fis-experiment
  namespace: {{ .Values.namespace }}
subjects: [ { kind: Group, name: fis-experiment, apiGroup: rbac.authorization.k8s.io } ]
roleRef: { kind: Role, name: fis-experiment, apiGroup: rbac.authorization.k8s.io }
{{- end }}
