# Where every ExternalSecret reads from: AWS Secrets Manager, with the identity of the external-secrets Pod
# Identity role (terraform/pod_identity.tf), which may only read task-api/<env>/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
