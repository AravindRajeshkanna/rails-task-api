# Generated by deploy/scripts/render_local_rules.rb from deploy/observability/prometheus/task-api-rules.yaml and deploy/observability/prometheus/task-api-slo.yaml: do not edit, run it.
---
groups:
- name: task-api.recording
  interval: 30s
  rules:
  - record: taskapi:http_requests:rate5m
    expr: sum(rate(taskapi_http_requests_total[5m]))
  - record: taskapi:http_error_ratio:rate5m
    expr: |
      (sum(rate(taskapi_http_requests_total{status=~"5.."}[5m])) or vector(0))
      / clamp_min(sum(rate(taskapi_http_requests_total[5m])), 1)
  - record: taskapi:http_latency_seconds:p95
    expr: histogram_quantile(0.95, sum by (le) (rate(taskapi_http_request_duration_seconds_bucket[5m])))
  - record: taskapi:queue_ready_jobs:total
    expr: sum(max by (queue) (taskapi_queue_ready_jobs))
  - record: taskapi:queue_oldest_ready_age_seconds:max
    expr: max(taskapi_queue_oldest_ready_job_age_seconds)
  - record: taskapi:ai_cost_usd:increase1d
    expr: sum(increase(taskapi_ai_cost_usd_total[1d]))
- name: task-api.alerts
  rules:
  - alert: TaskApiHighErrorRate
    expr: taskapi:http_error_ratio:rate5m > 0.05 and taskapi:http_requests:rate5m
      > 0.2
    for: 5m
    labels:
      severity: page
    annotations:
      summary: More than 5% of API requests are failing
      description: 5xx ratio is {{ $value | humanizePercentage }}. Start at the Task
        API dashboard, then the trace for a failing route.
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/high-error-rate.md
  - alert: TaskApiHighLatency
    expr: taskapi:http_latency_seconds:p95 > 1
    for: 10m
    labels:
      severity: ticket
    annotations:
      summary: p95 API latency is above 1s
      description: p95 is {{ $value | humanizeDuration }}. Check slow endpoints, database
        load and AI calls on the request path.
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/high-latency.md
  - alert: TaskApiQueueBacklog
    expr: taskapi:queue_ready_jobs:total > 500
    for: 10m
    labels:
      severity: ticket
    annotations:
      summary: "{{ $value }} background jobs are waiting"
      description: KEDA should be scaling workers out. If it is not, see the queue-backlog
        runbook.
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/queue-backlog.md
  - alert: TaskApiQueueLatency
    expr: taskapi:queue_oldest_ready_age_seconds:max > 300
    for: 5m
    labels:
      severity: page
    annotations:
      summary: The oldest waiting job is {{ $value | humanizeDuration }} old
      description: Jobs (emails, webhooks, embeddings) are not being picked up.
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/queue-backlog.md
  - alert: TaskApiEventOutboxStuck
    expr: max(taskapi_outbox_oldest_pending_event_age_seconds) > 300
    for: 5m
    labels:
      severity: page
    annotations:
      summary: The oldest unpublished event is {{ $value | humanizeDuration }} old
      description: 'Changes are not reaching the other services (email, Slack). Nothing
        is lost: events wait in the outbox.'
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/event-outbox.md
  - alert: TaskApiReadOnly
    expr: sum(increase(taskapi_read_only_refusals_total[5m])) > 0
    for: 15m
    labels:
      severity: ticket
    annotations:
      summary: Writes have been refused as read-only for 15 minutes
      description: Planned during a switchover. Otherwise traffic reached a region
        whose database is not promoted yet, or a writer was demoted.
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/regional-failover.md
  - alert: TaskApiCircuitOpen
    expr: max by (breaker) (taskapi_circuit_breaker_state) == 2
    for: 5m
    labels:
      severity: ticket
    annotations:
      summary: The {{ $labels.breaker }} circuit breaker has been open for 5 minutes
      description: Calls to that dependency fail at once instead of waiting out their
        timeout. The API itself is up; the features that need it answer 503 with a
        Retry-After.
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/ai-provider-issues.md
  - alert: TaskApiLoadShedding
    expr: sum(rate(taskapi_load_shed_total[5m])) > 0.1
    for: 10m
    labels:
      severity: ticket
    annotations:
      summary: The API has been refusing expensive reads because every thread is busy
      description: 'More than one in ten seconds, for ten minutes. Cheap reads and
        writes are still served; searches, analytics and the feed answer 503 with
        a Retry-After. This is capacity: add API pods (the HPA should have), or look
        for a client in a loop.'
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/high-latency.md
  - alert: TaskApiNoWorkers
    expr: max(taskapi_queue_workers) == 0 and taskapi:queue_ready_jobs:total > 0
    for: 5m
    labels:
      severity: page
    annotations:
      summary: Jobs are waiting but no worker process is alive
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/queue-backlog.md
  - alert: TaskApiFailedJobs
    expr: max(taskapi_queue_failed_jobs) > 0
    for: 30m
    labels:
      severity: ticket
    annotations:
      summary: "{{ $value }} jobs have exhausted their retries"
      description: Inspect them with `bin/rails runner 'SolidQueue::FailedExecution.all'`
        and retry or discard.
  - alert: TaskApiDatabasePoolSaturated
    expr: |
      max by (pod) (taskapi_db_pool_connections{state="busy"})
      / max by (pod) (taskapi_db_pool_connections{state="size"}) > 0.9
    for: 5m
    labels:
      severity: ticket
    annotations:
      summary: Pod {{ $labels.pod }} is using over 90% of its database connections
      description: Requests will start waiting for a connection. Raise RAILS_MAX_THREADS/pool
        or add replicas.
  - alert: TaskApiAiErrors
    expr: |
      sum(rate(taskapi_ai_requests_total{outcome="error"}[10m]))
      / clamp_min(sum(rate(taskapi_ai_requests_total[10m])), 0.01) > 0.2
    for: 10m
    labels:
      severity: ticket
    annotations:
      summary: More than 20% of model calls are failing
      description: Usually provider throttling (check Bedrock quotas) or an expired
        model access grant.
  - alert: TaskApiAiSpend
    expr: taskapi:ai_cost_usd:increase1d > 50
    labels:
      severity: ticket
    annotations:
      summary: AI spend is ${{ $value | printf "%.2f" }} in the last 24h
      description: Per-user and per-project budgets cap each tenant; this fires when
        the total is unexpectedly high.
  - alert: TaskApiMetricsCollectorFailing
    expr: increase(taskapi_collector_errors_total[15m]) > 0
    for: 15m
    labels:
      severity: ticket
    annotations:
      summary: The {{ $labels.collector }} collector keeps failing; queue and pool
        metrics may be stale
- name: task-api.encryption
  rules:
  - alert: TaskApiKmsFailing
    expr: sum by (operation, outcome) (increase(taskapi_kms_requests_total{outcome!="ok"}[10m]))
      > 0
    for: 10m
    labels:
      severity: ticket
    annotations:
      summary: 'KMS requests are failing ({{ $labels.operation }}: {{ $labels.outcome
        }})'
      description: 'Creating a webhook answers 503 encryption_unavailable, webhook
        deliveries wait and retry, and a pod that starts cannot become ready. access_denied:
        the role lost its permission or the key policy changed. throttled: see the
        KMS request quota. key_unusable: the key or alias is disabled, pending deletion
        or missing.'
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/kms-key-rotation.md
  - alert: TaskApiKmsUnusualVolume
    expr: sum(rate(taskapi_kms_requests_total[15m])) > 2
    for: 15m
    labels:
      severity: ticket
    annotations:
      summary: The application is calling KMS {{ $value | printf "%.1f" }} times a
        second
      description: Unwrapped keys are cached, so this should be a trickle. A cache
        that stopped working, a loop that reads many different encrypted values, or
        a rollout storm. Each request is billed and counts against the KMS quota.
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/kms-key-rotation.md
- name: task-api.slo
  interval: 1m
  rules:
  - record: slo:availability_error_ratio:rate5m
    expr: sum(rate(taskapi_http_requests_total{controller=~"Api::V1::.*",status=~"5.."}[5m]))
      / sum(rate(taskapi_http_requests_total{controller=~"Api::V1::.*"}[5m]))
  - record: slo:availability_error_ratio:rate30m
    expr: sum(rate(taskapi_http_requests_total{controller=~"Api::V1::.*",status=~"5.."}[30m]))
      / sum(rate(taskapi_http_requests_total{controller=~"Api::V1::.*"}[30m]))
  - record: slo:availability_error_ratio:rate1h
    expr: sum(rate(taskapi_http_requests_total{controller=~"Api::V1::.*",status=~"5.."}[1h]))
      / sum(rate(taskapi_http_requests_total{controller=~"Api::V1::.*"}[1h]))
  - record: slo:availability_error_ratio:rate2h
    expr: sum(rate(taskapi_http_requests_total{controller=~"Api::V1::.*",status=~"5.."}[2h]))
      / sum(rate(taskapi_http_requests_total{controller=~"Api::V1::.*"}[2h]))
  - record: slo:availability_error_ratio:rate6h
    expr: sum(rate(taskapi_http_requests_total{controller=~"Api::V1::.*",status=~"5.."}[6h]))
      / sum(rate(taskapi_http_requests_total{controller=~"Api::V1::.*"}[6h]))
  - record: slo:availability_error_ratio:rate1d
    expr: sum(rate(taskapi_http_requests_total{controller=~"Api::V1::.*",status=~"5.."}[1d]))
      / sum(rate(taskapi_http_requests_total{controller=~"Api::V1::.*"}[1d]))
  - record: slo:availability_error_ratio:rate3d
    expr: sum(rate(taskapi_http_requests_total{controller=~"Api::V1::.*",status=~"5.."}[3d]))
      / sum(rate(taskapi_http_requests_total{controller=~"Api::V1::.*"}[3d]))
  - record: slo:latency_slow_ratio:rate30m
    expr: 1 - (sum(rate(taskapi_http_request_duration_seconds_bucket{controller=~"Api::V1::.*",le="0.5"}[30m]))
      / sum(rate(taskapi_http_request_duration_seconds_count{controller=~"Api::V1::.*"}[30m])))
  - record: slo:latency_slow_ratio:rate6h
    expr: 1 - (sum(rate(taskapi_http_request_duration_seconds_bucket{controller=~"Api::V1::.*",le="0.5"}[6h]))
      / sum(rate(taskapi_http_request_duration_seconds_count{controller=~"Api::V1::.*"}[6h])))
  - record: slo:latency_slow_ratio:rate3d
    expr: 1 - (sum(rate(taskapi_http_request_duration_seconds_bucket{controller=~"Api::V1::.*",le="0.5"}[3d]))
      / sum(rate(taskapi_http_request_duration_seconds_count{controller=~"Api::V1::.*"}[3d])))
  - record: slo:requests:rate1h
    expr: sum(rate(taskapi_http_requests_total{controller=~"Api::V1::.*"}[1h]))
  - alert: TaskApiAvailabilityBudgetBurnFast
    expr: slo:availability_error_ratio:rate1h > (14.4 * 0.001) and slo:availability_error_ratio:rate5m
      > (14.4 * 0.001) and slo:requests:rate1h > 0.05
    labels:
      severity: page
      slo: availability
      burn: fast
    annotations:
      summary: Spending the availability error budget 14x too fast (2% of the month's
        budget per hour)
      description: "{{ $value | humanizePercentage }} of API requests failed over
        the last hour, and it is still happening (the last 5 minutes are as bad).
        At this rate the month's budget lasts 2 days."
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/high-error-rate.md
  - alert: TaskApiAvailabilityBudgetBurnSlow
    expr: slo:availability_error_ratio:rate6h > (6 * 0.001) and slo:availability_error_ratio:rate30m
      > (6 * 0.001) and slo:requests:rate1h > 0.05
    labels:
      severity: page
      slo: availability
      burn: slow
    annotations:
      summary: Spending the availability error budget 6x too fast (5% of the month's
        budget in six hours)
      description: "{{ $value | humanizePercentage }} of API requests failed over
        the last six hours, and it is still happening. A lower rate than a fast burn,
        but a steady one: at this rate the month's budget lasts 5 days."
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/high-error-rate.md
  - alert: TaskApiAvailabilityBudgetLeak
    expr: slo:availability_error_ratio:rate1d > (3 * 0.001) and slo:availability_error_ratio:rate2h
      > (3 * 0.001) and slo:requests:rate1h > 0.05
    labels:
      severity: ticket
      slo: availability
      burn: leak
    annotations:
      summary: Spending the availability error budget 3x too fast, for a day
      description: 'Not an emergency, and not going away by itself: at this rate the
        month''s budget lasts 10 days. Find the route or the dependency behind it.'
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/high-error-rate.md
  - alert: TaskApiAvailabilityBudgetDrip
    expr: slo:availability_error_ratio:rate3d > (1 * 0.001) and slo:availability_error_ratio:rate6h
      > (1 * 0.001) and slo:requests:rate1h > 0.05
    labels:
      severity: ticket
      slo: availability
      burn: drip
    annotations:
      summary: The availability error budget is being spent exactly as fast as it
        is earned, for three days
      description: The SLO will be missed this month if nothing changes.
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/high-error-rate.md
  - alert: TaskApiLatencyBudgetBurnFast
    expr: slo:latency_slow_ratio:rate6h > (6 * 0.05) and slo:latency_slow_ratio:rate30m
      > (6 * 0.05) and slo:requests:rate1h > 0.05
    labels:
      severity: ticket
      slo: latency
      burn: fast
    annotations:
      summary: 30% of API requests are slower than 500 ms, for six hours (the latency
        budget burning 6x too fast)
      description: Look at the Task API dashboard for the route, and at database load
        and the circuit breakers.
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/high-latency.md
  - alert: TaskApiLatencyBudgetDrip
    expr: slo:latency_slow_ratio:rate3d > (1 * 0.05) and slo:latency_slow_ratio:rate6h
      > (1 * 0.05) and slo:requests:rate1h > 0.05
    labels:
      severity: ticket
      slo: latency
      burn: drip
    annotations:
      summary: More than 5% of API requests have been slower than 500 ms for three
        days
      description: The latency SLO will be missed this month if nothing changes.
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/runbooks/high-latency.md
- name: task-api.slo.inputs
  rules:
  - alert: TaskApiNotScraped
    expr: up{pod=~"api-.*"} == 0 or absent(up{pod=~"api-.*"})
    for: 15m
    labels:
      severity: ticket
    annotations:
      summary: Prometheus is not getting the API's metrics, so the SLO alerts cannot
        fire
      description: A scrape of an API pod is failing, or no API pod is being scraped
        at all. Check the PodMonitor, the METRICS_TOKEN secret and the NetworkPolicy;
        a 403 means the token the scraper sends is not the one the pod demands.
      runbook_url: https://github.com/AravindRajeshkanna/rails-task-api/blob/main/docs/slo.md#when-the-numbers-stop-arriving
