# Stands in for the AWS Application Load Balancer in local development: the same path-based routing the
# Ingress defines (deploy/helm/values). Clients talk to one host; paths pick the service.
worker_processes 1;
events { worker_connections 256; }

http {
  # Docker's DNS: resolve service names at request time, so the gateway starts even if a service is still booting.
  resolver 127.0.0.11 valid=10s;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  client_max_body_size 12m;

  server {
    listen 8080;

    # Credentials are issued by the Auth service.
    location ~ ^/api/v1/(registrations|session|passwords) {
      set $auth http://auth:3000;
      proxy_pass $auth;
    }

    # Everything else is the Task API (the façade the other services sit behind).
    location / {
      set $api http://api:3000;
      proxy_pass $api;
    }

    # Internal endpoints are not for the outside world.
    location ~ ^/(metrics|\.well-known) { return 404; }
  }
}
