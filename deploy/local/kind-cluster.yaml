# A local Kubernetes cluster with the same chart and values the cloud uses: kind create cluster --config this file
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: task-api
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 8080, protocol: TCP }
  - role: worker
  - role: worker
