# Generated by deploy/scripts/render_gitops.rb from templates/ and `terraform output`. Edit the template, not this file.
image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/task-api/api
  tag: bootstrap                 # CI replaces this with the git SHA on every deploy
replicaCount: 3
autoscaling: { minReplicas: 3, maxReplicas: 12 }
secrets: { prefix: task-api/prod }
rollout: { enabled: true, analysis: { enabled: true } }
env:
  APP_BASE_URL: https://api.taskapi.example.com
  FRONTEND_URL: https://app.taskapi.example.com
  CORS_ORIGINS: https://app.taskapi.example.com
  ALLOWED_HOSTS: api.taskapi.example.com,api,api.task-api,api.task-api.svc,api.task-api.svc.cluster.local
  DB_HOST: task-api-prod.cluster-xxxx.us-east-1.rds.amazonaws.com
  AWS_REGION: us-east-1
  APP_ENV: prod
  AUTH_ISSUER: https://api.taskapi.example.com
  AUTH_JWKS_URL: http://auth/.well-known/jwks.json
  EVENTS_SNS_TOPIC_ARN: arn:aws:sns:us-east-1:123456789012:task-api-prod-events
  AI_PROVIDER: ""
  AWS_S3_BUCKET: task-api-prod-storage
ingress:
  host: api.taskapi.example.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: task-api-prod
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-east-1:123456789012:regional/webacl/task-api-prod/00000000-0000-0000-0000-000000000000
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
networkPolicy:
  ingressFromCIDRs: [ 10.0.0.0/16 ]
  egressToCIDRs: [ { cidr: 10.0.0.0/16, ports: [ 5432 ] } ]
