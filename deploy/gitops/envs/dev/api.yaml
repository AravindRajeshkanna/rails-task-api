# Generated by deploy/scripts/render_gitops.rb from templates/ and `terraform output`. Edit the template, not this file.
image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/task-api/api
  tag: bootstrap                 # CI replaces this with the git SHA on every deploy
replicaCount: 1
autoscaling: { minReplicas: 1, maxReplicas: 3 }
secrets: { prefix: task-api/dev }
rollout: { enabled: false, analysis: { enabled: false } }
env:
  APP_BASE_URL: https://api.dev.taskapi.example.com
  FRONTEND_URL: https://app.dev.taskapi.example.com
  CORS_ORIGINS: https://app.dev.taskapi.example.com
  ALLOWED_HOSTS: api.dev.taskapi.example.com,api,api.task-api,api.task-api.svc,api.task-api.svc.cluster.local
  DB_HOST: task-api-dev.cluster-xxxx.us-east-1.rds.amazonaws.com
  DB_REPLICA_HOST: task-api-dev.cluster-ro-xxxx.us-east-1.rds.amazonaws.com   # the Aurora reader endpoint: opted-in reads go there (ReplicaRouting); unset it to send everything to the writer
  AWS_REGION: us-east-1
  APP_ENV: dev
  AUTH_ISSUER: https://api.dev.taskapi.example.com
  AUTH_JWKS_URL: http://auth/.well-known/jwks.json
  EVENTS_SNS_TOPIC_ARN: arn:aws:sns:us-east-1:123456789012:task-api-dev-events
  AI_PROVIDER: ""
  AWS_S3_BUCKET: task-api-dev-storage
  READ_ONLY: "false"        # true on the standby until its database is promoted (config/initializers/read_only_mode.rb)
ingress:
  host: api.dev.taskapi.example.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: task-api-dev
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-east-1:123456789012:regional/webacl/task-api-dev/00000000-0000-0000-0000-000000000000
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
networkPolicy:
  ingressFromCIDRs: [ 10.0.0.0/16 ]
  egressToCIDRs: [ { cidr: 10.0.0.0/16, ports: [ 5432 ] } ]
