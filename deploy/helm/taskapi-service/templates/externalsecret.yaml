{{- if .Values.secrets.enabled }}
apiVersion: {{ .Values.secrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "taskapi.fullname" . }}
  labels: {{- include "taskapi.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef: {{- toYaml .Values.secrets.storeRef | nindent 4 }}
  target:
    name: {{ include "taskapi.fullname" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.secrets.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ printf "%s/%s" $.Values.secrets.prefix .key }}
        {{- with .property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
