  "/api/v1/search":
    get:
      summary: Search tasks across my projects
      tags:
      - Search
      description: Full-text search of task titles and descriptions in every project
        the caller can see (including through a team or an organization), best match
        first. Words are stemmed (`deploying` finds `deployed`); `"quoted phrases"`,
        `or` and `-excluded` work; any text is safe. Deleted tasks and archived projects
        never match. Inside one project, use `search` on its task list.
      security:
      - bearer_auth: []
      parameters:
      - name: q
        in: query
        required: true
        description: What to look for, at most 200 characters
        schema:
          type: string
      - name: project_id
        in: query
        required: false
        description: Only this project
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: A page of matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/SearchResult"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
        '400':
          description: q is missing or longer than 200 characters
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/projects/{project_id}/tasks":
    parameters:
    - name: project_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: List and search tasks
      tags:
      - Tasks
      description: Filters combine with AND. Invalid values return 400 with `details.parameter`.
      security:
      - bearer_auth: []
      parameters:
      - name: status
        in: query
        required: false
        description: 'Comma-separated: todo, in_progress, done'
        schema:
          type: string
      - name: priority
        in: query
        required: false
        description: 'Comma-separated: low, medium, high, urgent'
        schema:
          type: string
      - name: assignee
        in: query
        required: false
        description: "`me`, `unassigned` or a user id"
        schema:
          type: string
      - name: tag
        in: query
        required: false
        description: Comma-separated tag names (any match)
        schema:
          type: string
      - name: due_from
        in: query
        format: date
        required: false
        schema:
          type: string
      - name: due_to
        in: query
        format: date
        required: false
        schema:
          type: string
      - name: overdue
        in: query
        required: false
        description: Only unfinished tasks past their due date
        schema:
          type: boolean
      - name: q
        in: query
        required: false
        description: Case-insensitive substring search of title and description
        schema:
          type: string
      - name: search
        in: query
        required: false
        description: 'Full-text search of title and description (max 200 characters):
          words are stemmed, `"quoted phrases"`, `or` and `-excluded` work. Best match
          first unless `sort` is given'
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: Comma-separated columns (created_at, updated_at, due_on, priority,
          status, title); prefix `-` for descending. Default `-created_at`
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        allowEmptyValue: true
        description: Switches to keyset pagination, which costs the same at any depth
          and does not skip or repeat tasks when others are added meanwhile, but has
          no total. Send it empty for the first page, then `meta.next_cursor` of the
          previous response (with the same filters and sort). Only for sorts by `created_at`,
          `updated_at` and `title` (not by relevance, `priority`, `status` or `due_on`);
          an invalid cursor is a 400. Replaces `page`.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: A page of tasks by cursor (`meta` has `next_cursor` and `has_more`,
            no total)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Task"
                  meta:
                    "$ref": "#/components/schemas/KeysetMeta"
                required:
                - data
                - meta
        '400':
          description: Invalid filter, sort or cursor value
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Not a member of the project
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Create a task
      tags:
      - Tasks
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Task"
                required:
                - data
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                description:
                  type: string
                status:
                  type: string
                  enum:
                  - todo
                  - in_progress
                  - done
                priority:
                  type: string
                  enum:
                  - low
                  - medium
                  - high
                  - urgent
                due_on:
                  type: string
                  format: date
                assignee_id:
                  type: integer
                  description: Must be a project member
                tag_names:
                  type: array
                  items:
                    type: string
                  description: Replaces the task's tags; unknown names are created
                lock_version:
                  type: integer
                  description: 'Optimistic locking: a stale value returns 409'
              required:
              - title
