  "/api/v1/projects/{project_id}/webhooks":
    parameters:
    - name: project_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: List webhooks
      tags:
      - Webhooks
      description: Project admins only.
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Webhooks (secrets are never listed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Webhook"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
    post:
      summary: Register a webhook
      tags:
      - Webhooks
      description: |
        Deliveries are `POST`ed as JSON with headers `X-TaskApi-Event`, `X-TaskApi-Delivery`, `X-TaskApi-Timestamp` and
        `X-TaskApi-Signature: sha256=<hex>`, where the signature is `HMAC-SHA256(secret, "<timestamp>.<raw body>")`.
        Failed deliveries are retried up to 6 times with back-off. The `secret` is returned only in this response.
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Webhook"
                required:
                - data
        '422':
          description: Invalid URL or unknown event
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: https:// only in production. Private and loopback addresses
                    are blocked.
                events:
                  type: array
                  items:
                    type: string
                    enum:
                    - task.created
                    - task.updated
                    - task.completed
                    - task.discarded
                    - task.restored
                    - comment.created
                    - project.updated
                    - project.discarded
                    - project.restored
                  description: Empty subscribes to everything
                active:
                  type: boolean
              required:
              - url
