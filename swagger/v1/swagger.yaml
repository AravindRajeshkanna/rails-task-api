        schema:
          type: boolean
      - name: q
        in: query
        required: false
        description: Case-insensitive search of title and description
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: Comma-separated columns (created_at, updated_at, due_on, priority,
          status, title); prefix `-` for descending. Default `-created_at`
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: limit
        in: query
