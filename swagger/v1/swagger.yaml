                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
    post:
      summary: Give a team access
      tags:
      - Teams
      description: Project admins grant a team of the project's organization access,
        as `member` (default) or `admin`; everyone in the team gets that role, added
        up with their other routes in. A team from anywhere else, and an id that matches
        no team, get the same `422`.
