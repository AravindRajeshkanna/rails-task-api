            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/organizations/{organization_id}/invitations":
    parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: List open invitations
      tags:
      - Organizations
      description: 'Invitations that can still be accepted. Owners and admins only:
        they carry email addresses.'
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: A page of invitations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/OrganizationInvitation"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
        '403':
          description: Plain members cannot list invitations
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: Invite someone
      tags:
      - Organizations
      description: Invites an email address and mails it a link; the response is the
        same whether or not the address belongs to a registered user, and never contains
        the token. Inviting an address that already has an open invitation refreshes
        it and mails the link again. Owners may offer any role; admins may offer `member`.
        Valid for 7 days.
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/OrganizationInvitation"
                required:
                - data
        '403':
          description: Not allowed to offer that role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Invalid address, or already a member
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email_address:
                  type: string
                  format: email
                role:
                  type: string
                  enum:
                  - member
                  - admin
                  - owner
                  default: member
              required:
              - email_address
  "/api/v1/organizations/{organization_id}/invitations/{id}":
    parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: integer
