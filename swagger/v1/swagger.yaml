---
openapi: 3.0.3
info:
  title: Task API
  version: v1
  description: |
    A task / project management API.

    **Authentication.** `POST /api/v1/registrations` or `POST /api/v1/session` returns a bearer token.
    Send it as `Authorization: Bearer <token>`.

    **Errors.** Every failure uses the same envelope:
    `{ "error": { "status": 422, "code": "validation_failed", "message": "...", "details": { ... } } }`.

    **Pagination.** List endpoints accept `page` and `limit` (default 25, max 100) and return
    `meta` plus `Link`, `Total-Count`, `Total-Pages`, `Current-Page` and `Page-Limit` headers.

    **AI.** `/api/v1/ai/*` and `/api/v1/projects/{id}/summary` use language models. Calls are rate limited per
    user (`429 rate_limited`) and metered against a daily token budget (`429 ai_budget_exceeded`, with
    `Retry-After`). `503 ai_not_configured` means the server has no model provider; `503 ai_unavailable`
    means the provider is busy.

    **Authorization.** Resources inside a project you do not belong to answer `404`, not `403`,
    so their existence is not disclosed. Owners and admins of an organization administer all of its
    projects without being added to each one.

    **Versioning.** Every response carries `API-Version`. A version being retired also sends
    `Deprecation` and `Sunset` headers (RFC 9745, RFC 8594).
servers:
- url: http://localhost:3000
  description: Local development
tags:
- name: Authentication
- name: Account
- name: Projects
- name: Tasks
- name: AI
- name: Activity
- name: Analytics
- name: Comments
- name: Tags
- name: Memberships
- name: Organizations
- name: Webhooks
- name: Audit log
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Session token from sign-in or sign-up
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            status:
              type: integer
              example: 422
            code:
              type: string
              example: validation_failed
            message:
              type: string
            details:
              type: object
              description: Field errors (422) or the offending parameter (400)
            request_id:
              type: string
              description: Echoes the X-Request-Id response header; quote it in bug
                reports
          required:
          - status
          - code
          - message
      required:
      - error
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        count:
          type: integer
        pages:
          type: integer
        next:
          type: integer
          nullable: true
        previous:
          type: integer
          nullable: true
      required:
      - page
      - limit
      - count
      - pages
    KeysetMeta:
      type: object
      description: 'Cursor pagination: no totals. Pass next_cursor as `cursor` to
        get the following page.'
      properties:
        limit:
          type: integer
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
      required:
      - limit
      - next_cursor
      - has_more
    UserSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email_address:
          type: string
          format: email
        avatar_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - email_address
      - created_at
    Session:
      type: object
      description: The plaintext token is only ever returned here; store it securely.
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        user:
          "$ref": "#/components/schemas/User"
      required:
      - token
      - expires_at
      - user
    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - member
          - admin
          nullable: true
          description: The caller's role (admin also through owning or administering
            the project's organization)
        organization_id:
          type: integer
          nullable: true
          description: Set when the project was created inside an organization; fixed
            for life
        owner:
          "$ref": "#/components/schemas/UserSummary"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        stats:
          type: object
          description: Task counts (only on single-project responses)
          properties:
            todo:
              type: integer
            in_progress:
              type: integer
            done:
              type: integer
            overdue:
              type: integer
      required:
      - id
      - name
      - owner
    Attachment:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        content_type:
          type: string
        byte_size:
          type: integer
        url:
          type: string
          description: Signed URL, valid for 10 minutes
      required:
      - id
      - filename
      - url
    Task:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - todo
          - in_progress
          - done
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - urgent
        due_on:
          type: string
          format: date
          nullable: true
        overdue:
          type: boolean
        completed_at:
          type: string
          format: date-time
          nullable: true
        comments_count:
          type: integer
        lock_version:
          type: integer
          description: Send back on update for optimistic locking; a stale value returns
            409
        tags:
          type: array
          items:
            type: string
        creator:
          "$ref": "#/components/schemas/UserSummary"
        assignee:
          allOf:
          - "$ref": "#/components/schemas/UserSummary"
          nullable: true
        attachments:
          type: array
          items:
            "$ref": "#/components/schemas/Attachment"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - project_id
      - title
      - status
      - priority
      - tags
      - creator
      - attachments
    AiUsage:
      type: object
      description: What the call cost. Spend is metered against a daily token budget
        per user and per project.
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        model_id:
          type: string
          nullable: true
        latency_ms:
          type: integer
      required:
      - input_tokens
      - output_tokens
    PrioritySuggestion:
      type: object
      properties:
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - urgent
        rationale:
          type: string
        estimated_days:
          type: integer
          nullable: true
          description: Calendar days until the task is likely done
        predicted_due_on:
          type: string
          format: date
          nullable: true
          description: Today plus estimated_days, computed by the API
        at_risk:
          type: boolean
          nullable: true
          description: True when predicted_due_on is after the task's due date
        confidence:
          type: number
        similar_tasks:
          type: array
          description: Finished tasks the estimate is based on
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string
              priority:
                type: string
              days_to_complete:
                type: integer
      required:
      - priority
      - rationale
    TagSuggestion:
      type: object
      properties:
        name:
          type: string
        confidence:
          type: number
        new:
          type: boolean
          description: Not yet a tag of this project
      required:
      - name
      - confidence
      - new
    AssigneeSuggestion:
      type: object
      properties:
        user_id:
          type: integer
        name:
          type: string
        score:
          type: number
        reasons:
          type: array
          items:
            type: string
      required:
      - user_id
      - name
      - score
      - reasons
    TaskDraft:
      type: object
      description: What the model understood from the text (dry runs return this instead
        of a task).
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        due_on:
          type: string
          format: date
          nullable: true
        priority:
          type: string
          nullable: true
        assignee_id:
          type: integer
          nullable: true
        tag_names:
          type: array
          items:
            type: string
      required:
      - title
    ChatReply:
      type: object
      properties:
        reply:
          type: string
        actions:
          type: array
          description: Every tool call the assistant made on the caller's behalf
          items:
            type: object
            properties:
              tool:
                type: string
              input:
                type: object
              ok:
                type: boolean
              result:
                type: object
                description: Present for changes (created or updated records)
              error:
                type: string
            required:
            - tool
            - ok
      required:
      - reply
      - actions
    AiBudget:
      type: object
      properties:
        day:
          type: string
          format: date
        tokens_used:
          type: integer
        daily_token_limit:
          type: integer
        tokens_remaining:
          type: integer
        calls:
          type: integer
        cost_usd:
          type: number
        resets_at:
          type: string
          format: date-time
      required:
      - tokens_used
      - daily_token_limit
      - tokens_remaining
      - resets_at
    ProjectSummary:
      type: object
      properties:
        headline:
          type: string
        summary:
          type: string
        highlights:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        next_steps:
          type: array
          items:
            type: string
        stats:
          type: object
        generated_at:
          type: string
          format: date-time
      required:
      - headline
      - summary
    Comment:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
        body:
          type: string
        user:
          "$ref": "#/components/schemas/UserSummary"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - task_id
      - body
      - user
    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
    Membership:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        role:
          type: string
          enum:
          - member
          - admin
        user:
          "$ref": "#/components/schemas/UserSummary"
        created_at:
          type: string
          format: date-time
      required:
      - id
      - role
      - user
    Webhook:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        url:
          type: string
        events:
          type: array
          items:
            type: string
          description: Empty means every event
        active:
          type: boolean
        secret:
          type: string
          description: Signing secret; only present in the create response
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - url
      - events
      - active
    WebhookDelivery:
      type: object
      properties:
        id:
          type: integer
        webhook_id:
          type: integer
        event:
          type: string
        status:
          type: string
          enum:
          - pending
          - delivered
          - failed
        response_status:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        payload:
          type: object
        delivered_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - event
      - status
    Organization:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          enum:
          - member
          - admin
          - owner
          nullable: true
          description: The caller's role in it
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
    OrganizationMember:
      type: object
      properties:
        id:
          type: integer
        role:
          type: string
          enum:
          - member
          - admin
          - owner
        user:
          "$ref": "#/components/schemas/UserSummary"
        created_at:
          type: string
          format: date-time
      required:
      - id
      - role
      - user
    Notification:
      type: object
      description: An item in the caller's inbox. `data` is a snapshot taken when
        it happened.
      properties:
        id:
          type: integer
        kind:
          type: string
          enum:
          - task.assigned
          - task.due_soon
          - task.completed
          - comment.created
        project_id:
          type: integer
        task_id:
          type: integer
        data:
          type: object
          description: task_title, project_name, and as relevant due_on and comment_excerpt
        read:
          type: boolean
        read_at:
          type: string
          format: date-time
          nullable: true
        actor:
          allOf:
          - "$ref": "#/components/schemas/UserSummary"
          nullable: true
          description: Who did it; absent for reminders
        created_at:
          type: string
          format: date-time
      required:
      - id
      - kind
      - project_id
      - task_id
      - data
      - read
      - created_at
    SearchResult:
      type: object
      description: A task that matched a full-text search. Highlights wrap matched
        words in « » (plain text, not HTML).
      properties:
        id:
          type: integer
        project_id:
          type: integer
        project:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
          required:
          - id
          - name
        title:
          type: string
        status:
          type: string
        priority:
          type: string
        due_on:
          type: string
          format: date
          nullable: true
        updated_at:
          type: string
          format: date-time
        rank:
          type: number
          description: Higher is a better match; title matches count for more than
            description matches
        highlights:
          type: object
          properties:
            title:
              type: string
              nullable: true
            description:
              type: string
              nullable: true
              description: One fragment around the best match
      required:
      - id
      - project_id
      - project
      - title
      - rank
      - highlights
    Team:
      type: object
      properties:
        id:
          type: integer
        organization_id:
          type: integer
        name:
          type: string
        members_count:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - organization_id
      - name
    TeamMember:
      type: object
      properties:
        id:
          type: integer
        user:
          "$ref": "#/components/schemas/UserSummary"
        created_at:
          type: string
          format: date-time
      required:
      - id
      - user
    ProjectTeam:
      type: object
      description: A team's access to a project, with the role each of its members
        gets there.
      properties:
        id:
          type: integer
        project_id:
          type: integer
        role:
          type: string
          enum:
          - member
          - admin
        team:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
          required:
          - id
          - name
        created_at:
          type: string
          format: date-time
      required:
      - id
      - project_id
      - role
      - team
    OrganizationInvitation:
      type: object
      description: An offer to join an organization, addressed to an email address.
        The token is only ever in the email.
      properties:
        id:
          type: integer
        email_address:
          type: string
          format: email
        role:
          type: string
          enum:
          - member
          - admin
          - owner
        status:
          type: string
          enum:
          - pending
          - accepted
          - revoked
          - expired
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        invited_by:
          "$ref": "#/components/schemas/UserSummary"
          nullable: true
      required:
      - id
      - email_address
      - role
      - status
      - expires_at
    Activity:
      type: object
      description: An audit event as an item of the feed.
      properties:
        id:
          type: integer
        project_id:
          type: integer
        action:
          type: string
          enum:
          - create
          - update
          - discard
          - restore
          - destroy
          - accept
          - revoke
        auditable_type:
          type: string
          enum:
          - Project
          - Task
          - Membership
        auditable_id:
          type: integer
        changes:
          type: object
          description: attribute => [old, new]
        actor:
          allOf:
          - "$ref": "#/components/schemas/UserSummary"
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - project_id
      - action
      - auditable_type
      - auditable_id
      - changes
    ProjectAnalytics:
      type: object
      properties:
        range:
          type: object
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            interval:
              type: string
              enum:
              - day
              - week
              - month
        totals:
          type: object
          description: Live (not deleted) tasks. `overdue` counts open tasks past
            their due date.
          properties:
            total:
              type: integer
            open:
              type: integer
            done:
              type: integer
            overdue:
              type: integer
            unassigned:
              type: integer
        by_status:
          type: object
          description: status => count
          additionalProperties:
            type: integer
        by_priority:
          type: object
          description: priority => count of open tasks
          additionalProperties:
            type: integer
        throughput:
          type: array
          description: One row per period in the range, empty periods included. `period`
            is the first day of the bucket (UTC; weeks start on Monday).
          items:
            type: object
            properties:
              period:
                type: string
                format: date
              created:
                type: integer
              completed:
                type: integer
        cycle_time_hours:
          type: object
          description: Creation-to-completion time of tasks completed in the range.
            `median` and `p90` are null when `sample` is 0.
          properties:
            sample:
              type: integer
            median:
              type: number
              nullable: true
            p90:
              type: number
              nullable: true
        workload:
          type: array
          description: Open tasks per assignee, most overdue first (at most 20 people).
          items:
            type: object
            properties:
              assignee:
                "$ref": "#/components/schemas/UserSummary"
              open:
                type: integer
              overdue:
                type: integer
      required:
      - range
      - totals
      - by_status
      - by_priority
      - throughput
      - cycle_time_hours
      - workload
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
          enum:
          - create
          - update
          - discard
          - restore
        auditable_type:
          type: string
        auditable_id:
          type: integer
        changes:
          type: object
          description: attribute => [old, new]
        actor:
          allOf:
          - "$ref": "#/components/schemas/UserSummary"
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - action
      - auditable_type
      - auditable_id
      - changes
paths:
  "/api/v1/registrations":
    post:
      summary: Sign up
      tags:
      - Authentication
      description: Creates an account and signs in. Limited to 10 attempts per hour
        per IP.
      parameters: []
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Session"
                required:
                - data
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email_address:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
              required:
              - name
              - email_address
              - password
  "/api/v1/session":
    post:
      summary: Sign in
      tags:
      - Authentication
      description: Exchanges credentials for a bearer token. Limited to 10 attempts
        per 3 minutes per IP and 5 per minute per account.
      parameters: []
      responses:
        '201':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Session"
                required:
                - data
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email_address:
                  type: string
                password:
                  type: string
              required:
              - email_address
              - password
    delete:
      summary: Sign out
      tags:
      - Authentication
      description: Revokes the token used for the request.
      security:
      - bearer_auth: []
      responses:
        '204':
          description: Signed out
        '401':
          description: Missing or invalid token
  "/api/v1/passwords":
    post:
      summary: Request a password reset
      tags:
      - Authentication
      description: Emails a link to the front end. Always answers 202, whether or
        not the address exists.
      parameters: []
      responses:
        '202':
          description: Accepted
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email_address:
                  type: string
              required:
              - email_address
  "/api/v1/passwords/{token}":
    patch:
      summary: Choose a new password
      tags:
      - Authentication
      description: Sets a new password using the emailed token (valid 15 minutes)
        and signs out every device.
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Password changed
        '422':
          description: Invalid or expired token, or weak password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 8
              required:
              - password
  "/api/v1/me":
    get:
      summary: Current user
      tags:
      - Account
      security:
      - bearer_auth: []
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/User"
                required:
                - data
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Update profile
      tags:
      - Account
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/User"
                required:
                - data
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
  "/api/v1/me/avatar":
    put:
      summary: Upload avatar
      tags:
      - Account
