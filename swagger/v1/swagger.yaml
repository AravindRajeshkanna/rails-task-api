  "/api/v1/activity":
    get:
      summary: Activity feed
      tags:
      - Activity
      description: Everything that happened in the projects you belong to (projects,
        tasks and membership changes), newest first. This is the member's view of
        the audit log; admins can also read a single project's full log at `/projects/{id}/audit_events`.
        Deleted projects contribute nothing until restored.
      security:
      - bearer_auth: []
      parameters:
      - name: project_id
        in: query
        required: false
        description: Only this project (ignored if you are not in it)
        schema:
          type: integer
      - name: type
        in: query
        required: false
        description: 'Comma-separated: Project, Task, Membership, ProjectTeam'
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Activity"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
        '400':
          description: Unknown `type`
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/ai/suggest_priority":
    post:
      summary: Suggest a priority and deadline
      tags:
      - AI
      description: Recommends a priority and estimates completion time. Pass `task_id`,
        or `project_id` with `title`. The estimate is grounded in similar finished
        tasks of the same project (embedding search).
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: A suggestion
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/PrioritySuggestion"
                  meta:
                    type: object
                    properties:
                      usage:
                        "$ref": "#/components/schemas/AiUsage"
                required:
                - data
        '404':
          description: Project or task not found, or not a member
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          description: title or project_id missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: Rate limited, or the daily token budget is used up (see error.code;
            Retry-After says when to retry)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id:
                  type: integer
                project_id:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                due_on:
                  type: string
                  format: date
                timezone:
                  type: string
                  example: Europe/Berlin
                  description: IANA zone used to decide what 'today' is
  "/api/v1/ai/suggest_tags":
    post:
      summary: Suggest tags
      tags:
      - AI
      description: 'Chooses up to five tags, preferring the project''s existing ones.
        `allow_new: false` restricts the answer to existing tags.'
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Tag suggestions, strongest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/TagSuggestion"
                  meta:
                    type: object
                    properties:
                      usage:
                        "$ref": "#/components/schemas/AiUsage"
                required:
                - data
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id:
                  type: integer
                project_id:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                allow_new:
                  type: boolean
  "/api/v1/ai/suggest_assignee":
    post:
      summary: Suggest an assignee
      tags:
      - AI
      description: 'Ranks project members by who finished similar tasks before, adjusted
        for current workload. Explainable and cheap: it uses embeddings, not text
        generation.'
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Up to three candidates, best first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/AssigneeSuggestion"
                required:
                - data
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id:
                  type: integer
                project_id:
                  type: integer
                title:
                  type: string
                description:
                  type: string
  "/api/v1/ai/create_from_text":
    post:
      summary: Create a task from a sentence
      tags:
      - AI
      description: '"Remind me to review the PR next Tuesday" becomes a task with
        a title and due date. Use `dry_run: true` to preview what the model understood
        without saving.'
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Task"
                  meta:
                    type: object
                    properties:
                      usage:
                        "$ref": "#/components/schemas/AiUsage"
                      interpreted:
                        "$ref": "#/components/schemas/TaskDraft"
                required:
                - data
        '200':
          description: 'Dry run: nothing saved'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/TaskDraft"
                  meta:
                    type: object
                    properties:
                      usage:
                        "$ref": "#/components/schemas/AiUsage"
                      interpreted:
                        "$ref": "#/components/schemas/TaskDraft"
                required:
                - data
        '502':
          description: The model's answer was unusable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: AI is not configured on this server, or the provider is busy
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: integer
                text:
                  type: string
                  maxLength: 1000
                dry_run:
                  type: boolean
                timezone:
                  type: string
                  example: America/New_York
              required:
              - project_id
              - text
  "/api/v1/ai/chat":
    post:
      summary: Chat with the task assistant
      tags:
      - AI
      description: 'A tool-using assistant that can list projects and tasks, create
        tasks and change task status as the caller, within the caller''s permissions.
        Stateless: send earlier turns as plain text in `history` (at most 10 are used).
        Every change it makes is reported in `actions`. It cannot delete anything.'
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: The assistant's reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/ChatReply"
                  meta:
                    type: object
                    properties:
                      usage:
                        "$ref": "#/components/schemas/AiUsage"
                required:
                - data
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  maxLength: 2000
                project_id:
                  type: integer
                  description: 'Optional: the project being viewed'
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                        - user
                        - assistant
                      text:
                        type: string
              required:
              - message
  "/api/v1/ai/usage":
    get:
      summary: My AI usage today
      tags:
      - AI
      description: Tokens used and remaining against today's (UTC) budget. Never rate
        limited.
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Today's usage
          content:
            application/json:
              schema:
                type: object
                properties:
