                    "$ref": "#/components/schemas/AiBudget"
                required:
                - data
  "/api/v1/projects/{project_id}/summary":
    get:
      summary: Summarize project progress
      tags:
      - AI
      description: An AI-written status report built from task counts and recent activity.
        Cached per project version for ten minutes (`meta.cached`); `refresh=true`
        forces a new one and counts against your budget.
      security:
      - bearer_auth: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
      - name: refresh
        in: query
        required: false
        schema:
          type: boolean
      - name: timezone
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/ProjectSummary"
                  meta:
                    type: object
                    properties:
                      cached:
                        type: boolean
                      usage:
                        "$ref": "#/components/schemas/AiUsage"
                required:
                - data
        '404':
          description: Not found, or not a member
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/projects/{project_id}/analytics":
    parameters:
    - name: project_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Project analytics
      tags:
      - Analytics
      description: 'What a project dashboard needs, computed by the database: counts
        by status and priority, tasks created and completed per period, how long completed
        tasks took, and who is carrying what. Any member can read it. Cached for five
        minutes, and invalidated as soon as a task in the project changes.'
      security:
      - bearer_auth: []
      parameters:
      - name: from
        in: query
        format: date
        required: false
        description: 'First day, ISO 8601 (default: 29 days before `to`)'
        schema:
          type: string
      - name: to
        in: query
        format: date
        required: false
        description: 'Last day, ISO 8601 (default: today, UTC)'
        schema:
          type: string
      - name: interval
        in: query
        required: false
        schema:
          type: string
          enum:
          - day
          - week
          - month
          default: week
        description: Bucket size for `throughput`. A range may span at most 120 buckets.
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/ProjectAnalytics"
                required:
                - data
        '422':
          description: Invalid range or interval (every problem is listed in `details`)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: Not found, or not a member
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/notifications":
    get:
      summary: List my notifications
      tags:
      - Notifications
      description: 'The caller''s inbox, newest first: tasks assigned to you, reminders
        for tasks due tomorrow, comments on your tasks, and completion of tasks you
        created. Things in a project you have left, or that is archived, are not listed.
        `meta.unread_count` counts all unread notifications whatever the filters.
        New ones are also pushed over `NotificationsChannel` (Action Cable).'
      security:
      - bearer_auth: []
      parameters:
      - name: unread
        in: query
        required: false
        description: Only unread ones
        schema:
          type: boolean
      - name: project_id
        in: query
        required: false
        schema:
          type: integer
      - name: kind
        in: query
        required: false
        description: 'Comma-separated: task.assigned, task.due_soon, task.completed,
          comment.created'
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: A page of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Notification"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required:
                - data
        '400':
          description: Unknown kind
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/notifications/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Mark a notification read or unread
      tags:
      - Notifications
      description: 'Idempotent: marking a read notification read again keeps its original
        time.'
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/Notification"
                required:
                - data
        '404':
          description: Not yours, or not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                read:
                  type: boolean
              required:
              - read
    delete:
      summary: Dismiss a notification
      tags:
      - Notifications
      security:
      - bearer_auth: []
      responses:
        '204':
          description: Deleted
  "/api/v1/notifications/read_all":
    post:
      summary: Mark everything read
      tags:
      - Notifications
      description: Marks all of the caller's unread notifications read, optionally
        only those of one project (`project_id` in the body).
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: How many were marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated:
                        type: integer
                    required:
                    - updated
                required:
                - data
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: integer
