type Project {
  createdAt: ISO8601DateTime!
  description: String
  id: ID!
  name: String!
  organizationId: ID
  owner: User!

  """
  The caller's role in the project (admin or member). Null where it was not looked up (a project reached through a task).
  """
  role: String

  """
  Newest first, unless `sort` or `search` says otherwise
  """
  tasks(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    `me`, `unassigned` or a user id
    """
    assignee: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
    overdue: Boolean
    priority: [TaskPriority!]

    """
    Full-text; best match first unless `sort` is given
    """
    search: String

    """
    As REST: comma-separated columns, `-` for descending
    """
    sort: String
    status: [TaskStatus!]
    tag: [String!]
  ): TaskConnection!
  updatedAt: ISO8601DateTime!
}

