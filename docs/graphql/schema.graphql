type Query {
  """
  The signed-in person
  """
  me: Viewer!

  """
  Your inbox, newest first
  """
  notifications(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
    unread: Boolean
  ): NotificationConnection!

  """
  Null if it does not exist or you cannot see it
  """
  project(id: ID!): Project

  """
  Projects you belong to (directly, through a team, or by administering their organization), newest first
  """
  projects(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
    organizationId: ID
  ): ProjectConnection!

  """
  Full-text search of tasks across your projects, best match first
  """
  search(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
    projectId: ID

    """
    Words are stemmed; "quoted phrases", or and -excluded work. At most 200 characters
    """
    query: String!
  ): SearchResultConnection!

  """
  Null if it does not exist or you cannot see it
  """
  task(id: ID!): Task
  unreadNotificationsCount: Int!
}

