# Recurring jobs, run by Solid Queue's scheduler (bin/jobs). Format: https://github.com/rails/solid_queue#recurring-tasks

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  due_soon_reminders:
    class: DueSoonRemindersJob
    schedule: every day at 8am

  purge_discarded_records:
    class: PurgeDiscardedJob
    schedule: every day at 3am

  prune_notifications:
    class: PurgeNotificationsJob
    schedule: every day at 3:30am

  prune_expired_sessions:
    command: "Session.expired.delete_all"
    schedule: every day at 4am

  # CloudWatch EMF series for anomaly detection and alarms (no-op unless METRICS_EMF=true).
  publish_queue_metrics:
    class: PublishQueueMetricsJob
    schedule: every minute
